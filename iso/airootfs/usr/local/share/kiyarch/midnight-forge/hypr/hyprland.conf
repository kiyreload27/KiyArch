# KiyArch Midnight Forge — Hyprland baseline
monitor = , preferred, auto, 1

$terminal = kitty
$launcher = fuzzel

exec-once = hyprpaper
exec-once = qs -c caelestia -n -d

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
        tap-to-click = yes
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(e87832ff)
    col.inactive_border = rgba(2a3036cc)
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96
    shadow {
        enabled = true
        range = 22
        render_power = 2
        color = rgba(00000066)
    }
    blur {
        enabled = true
        size = 8
        passes = 2
        vibrancy = 0.08
    }
}

animations {
    enabled = yes
    bezier = forge, 0.22, 1, 0.36, 1
    animation = windows, 1, 4, forge, slide
    animation = windowsOut, 1, 3, forge, slide
    animation = border, 1, 5, default
    animation = fade, 1, 3, forge
    animation = workspaces, 1, 4, forge, slide
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}

bind = SUPER, RETURN, exec, $terminal
bind = SUPER, SPACE, exec, $launcher
bind = SUPER, Q, killactive
bind = SUPER SHIFT, E, exit
bind = SUPER, F, fullscreen
bind = SUPER, V, togglefloating
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, K, movefocus, u
bind = SUPER, J, movefocus, d
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5

windowrule = opacity 0.94 override 0.90 override, class:^(kitty)$
layerrule = blur, caelestia.*
layerrule = ignorezero, caelestia.*
