# KiyArch live SSH defaults.
# The earlier filename is intentional: OpenSSH uses the first value it reads
# for most settings, and the releng profile includes 10-archiso.conf.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
X11Forwarding no
